<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Raax API inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#e8eded; --panel:#f8fafa; --panel-2:#edf1f1; --line:#d2dada; --line-2:#b7c4c4;
  --fg:#12201f; --fg-2:#46585a; --fg-3:#6b7e7f;
  --accent:#0a6a62; --accent-ink:#ffffff; --accent-wash:#d6eae7;
  --c-critical:#d03b3b; --c-high:#ec835a; --c-medium:#fab219; --c-low:#2a78d6; --c-info:#898781; --c-good:#0ca30c;
  --m-get:#1a6fa8; --m-post:#17794a; --m-put:#9a6200; --m-patch:#6b4bb0; --m-delete:#b53030; --m-other:#56676a;
  --shadow:0 16px 48px rgba(8,28,28,.22);
  --scrim:rgba(8,20,20,.42);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1112; --panel:#131b1c; --panel-2:#1a2425; --line:#243132; --line-2:#344647;
    --fg:#e4eded; --fg-2:#a9bbbc; --fg-3:#7a8d8e;
    --accent:#4cc7b9; --accent-ink:#06201d; --accent-wash:#123330;
    --c-low:#3987e5;
    --m-get:#5db0ea; --m-post:#48c487; --m-put:#e0a63a; --m-patch:#a38ae6; --m-delete:#ee7373; --m-other:#98a9ac;
    --shadow:0 16px 48px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1112; --panel:#131b1c; --panel-2:#1a2425; --line:#243132; --line-2:#344647;
  --fg:#e4eded; --fg-2:#a9bbbc; --fg-3:#7a8d8e;
  --accent:#4cc7b9; --accent-ink:#06201d; --accent-wash:#123330;
  --c-low:#3987e5;
  --m-get:#5db0ea; --m-post:#48c487; --m-put:#e0a63a; --m-patch:#a38ae6; --m-delete:#ee7373; --m-other:#98a9ac;
  --shadow:0 16px 48px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.dim{color:var(--fg-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand .sl{color:var(--accent)}
.brand .dim{font-weight:400}
.nav{display:flex;gap:2px;min-width:0;overflow-x:auto;order:3;flex-basis:100%;margin-inline:-6px;padding-bottom:1px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 10px;color:var(--fg-2);font-weight:500;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg-2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--c-good)}
.sync.warn i{background:var(--c-medium)}
.sync.busy i{background:var(--accent)}
@media (min-width:860px){.nav{order:0;flex-basis:auto;margin-inline:0}}
@media (max-width:520px){.sync span{display:none}}

/* buttons and fields */
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--c-critical)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--fg-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--fg)}
.btn[disabled]{opacity:.5;pointer-events:none}
.ro [data-edit]{display:none!important}
input,select,textarea{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:6px 9px;width:100%;min-width:0}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--fg-3)}
input[disabled],select[disabled],textarea[disabled]{background:var(--panel-2);color:var(--fg-2)}
select{appearance:auto}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:1px 8px 1px 7px;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;white-space:nowrap;color:var(--fg)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dc,var(--c-info));flex:none}
.chip i.ring{background:none;border:1.5px solid var(--dc,var(--fg-3))}
.chip i.half{background:linear-gradient(90deg,var(--dc,var(--accent)) 50%,transparent 50%);border:1.5px solid var(--dc,var(--accent))}
.chip.flag{background:none;border-color:var(--line-2)}
.chip.flag b{font-weight:700;font-family:var(--mono);font-size:11px;color:var(--fg)}
.s-critical{--dc:var(--c-critical)}.s-high{--dc:var(--c-high)}.s-medium{--dc:var(--c-medium)}.s-low{--dc:var(--c-low)}.s-info{--dc:var(--c-info)}
.m{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.02em;min-width:58px;text-align:center;padding:2px 6px;border-radius:4px;border:1px solid currentColor;color:var(--m-other);flex:none}
.m-GET{color:var(--m-get)}.m-POST{color:var(--m-post)}.m-PUT{color:var(--m-put)}.m-PATCH{color:var(--m-patch)}.m-DELETE{color:var(--m-delete)}
.path{font-family:var(--mono);font-size:13px;font-weight:500;overflow-wrap:anywhere}
.path b{font-weight:600;color:var(--accent)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--fg-2)}

/* main layout and panels */
.main{padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
.loading,.empty{padding:48px 16px;text-align:center;color:var(--fg-2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel>h2,.ph h2{font-size:15px;font-weight:700}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ph p,.sub{color:var(--fg-2);font-size:13px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.pagehead h1{font-size:24px;font-weight:800;letter-spacing:-.025em}

.empty h2{font-size:20px;font-weight:700;margin-bottom:6px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* dashboard stats */
.figs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:10px}
.fig{padding:14px 18px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);min-width:0}
.fig:first-child{border-left:0}
.fig-n{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.fig-l{font-weight:600}
.fig-s{font-size:12px;color:var(--fg-2)}
@media (max-width:760px){.figs{grid-template-columns:1fr 1fr}.fig:nth-child(3){border-left:0}.fig:nth-child(n+3){border-top:1px solid var(--line)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:1000px){.grid3{grid-template-columns:1fr}}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:center;gap:10px;font-size:13px}
.bl{display:flex;align-items:center;gap:7px;min-width:0}
.bl i{width:9px;height:9px;border-radius:50%;background:var(--dc,var(--c-info));flex:none}
.bl i.ring{background:none;border:1.5px solid var(--dc)}
.bt{display:flex;align-items:center;gap:8px;min-width:0}
.bf{height:16px;border-radius:0 4px 4px 0;background:var(--dc,var(--accent));min-width:2px;flex:none;max-width:calc(100% - 34px)}
.bv{font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.note{font-size:12px;color:var(--fg-2);margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:4px 8px;font-weight:600}
.tbl td{padding:8px;border-top:1px solid var(--line)}
.tbl .num{text-align:right;font-family:var(--mono)}
.tblwrap{overflow-x:auto}

/* inventory list */
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool .search{flex:1 1 240px;min-width:0}
.tool select{width:auto;flex:0 1 auto;max-width:100%}
.tool .count{font-size:12px;color:var(--fg-2);margin-left:auto}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lhead,.row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.3fr) 108px 100px 150px 150px 110px;gap:12px;align-items:center;padding:9px 14px}
.lhead{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);font-weight:600;border-bottom:1px solid var(--line);background:var(--panel-2)}
.row{border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover{background:var(--panel-2)}
.row>div{min-width:0}
.c-ep{display:flex;gap:10px;align-items:flex-start}
.ep-main{display:flex;flex-direction:column;min-width:0}
.ep-name{color:var(--fg-2);font-size:12px}
.ep-sub{color:var(--fg-3);font-size:12px}
.only-s{display:none}
.c-svc{display:flex;flex-direction:column;font-size:13px;overflow-wrap:anywhere}
.c-svc small{color:var(--fg-3);font-size:11px}
.c-rev{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
@media (max-width:1060px){
  .lhead,.row{grid-template-columns:minmax(0,3fr) 96px 140px 140px 100px}
  .c-svc,.h-svc,.c-auth,.h-auth{display:none}
}
@media (max-width:720px){
  .lhead,.row{grid-template-columns:minmax(0,1fr) 120px 92px}
  .c-exp,.h-exp,.c-rev,.h-rev{display:none}
  .only-s{display:block}
}
.rows-empty{padding:32px;text-align:center;color:var(--fg-2)}

/* transfer */
.stack{display:flex;flex-direction:column;gap:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plan{border:1px solid var(--line-2);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--panel-2)}
.plan h3{font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sumlist{display:flex;gap:8px 20px;flex-wrap:wrap}
.sumlist div{display:flex;gap:7px;align-items:baseline}
.sumlist b{font-family:var(--mono);font-size:18px}
.err{border:1px solid var(--c-critical);border-radius:8px;padding:10px 12px;background:var(--panel-2)}
.xrow{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.xrow:first-of-type{border-top:0}
.xrow .xl{min-width:0;flex:1 1 260px}
.xrow .xl b{display:block}
.xrow .xl span{font-size:12px;color:var(--fg-2)}
#exportOut{font-family:var(--mono);font-size:12px;min-height:160px;margin-top:8px}
.chk{display:flex;gap:6px;align-items:center;font-weight:400;font-size:13px}

/* drawer */
#backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(680px,100%);background:var(--panel);border-left:1px solid var(--line-2);box-shadow:var(--shadow);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.has-drawer #backdrop{display:block}
.has-drawer #drawer{display:flex}
.has-drawer{overflow:hidden}
.dpad{padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.dh{padding-block:14px 8px}
.dh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dh-path{font-family:var(--mono);font-size:19px;font-weight:600;overflow-wrap:anywhere;letter-spacing:-.01em;line-height:1.3}
.dh-path b{color:var(--accent)}
.dh-name{color:var(--fg-2);margin-top:3px}
.dh-meta{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin-top:12px}
.x{background:none;border:1px solid var(--line-2);border-radius:6px;width:32px;height:32px;font-size:20px;line-height:1;color:var(--fg-2)}
.x:hover{background:var(--panel-2);color:var(--fg)}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.dscroll{flex:1;overflow-y:auto;padding-block:16px 40px}
.sec{display:flex;flex-direction:column;gap:12px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0;margin-bottom:0}
.sec>h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g3 .span2{grid-column:span 2}
@media (max-width:560px){.g2,.g3{grid-template-columns:1fr}.g3 .span2{grid-column:auto}}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) 88px minmax(0,.9fr) 28px 30px;gap:6px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.prow .desc{grid-column:1/-1}
.prow .req{display:flex;align-items:center;justify-content:center;height:33px}
.rrow{display:grid;grid-template-columns:76px minmax(0,1fr) 30px;gap:6px;align-items:center}
.xbtn{background:none;border:0;color:var(--fg-3);font-size:18px;height:30px;border-radius:6px}
.xbtn:hover{background:var(--panel);color:var(--c-critical)}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.hist div:first-child{border-top:0}
.hist time{color:var(--fg-3);font-size:12px;font-family:var(--mono)}
@media (max-width:560px){.hist div{grid-template-columns:1fr;gap:2px}}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;z-index:70;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:none}
#toast.on{display:block}

/* Login, Bulk Tester Bar & UI/UX Modals */
#loginGate{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 20% 20%,var(--accent-wash),var(--bg) 70%);display:flex;align-items:center;justify-content:center;padding:16px}
#loginGate[hidden]{display:none!important}
.lcard{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);max-width:440px;width:100%;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.lcard h1{font-size:21px;font-weight:800}
.lcard .presets{display:flex;gap:6px;flex-wrap:wrap}
.bulkbar{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.bulkbar input[type=text]{max-width:220px}
.userpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:4px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--fg)}
.userpill b{color:var(--accent)}
.scanbox{border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;background:var(--panel-2);display:flex;flex-direction:column;gap:8px}
.scanrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.scanrow:first-child{border-top:0}

@media (prefers-reduced-motion:no-preference){
  #drawer{animation:slide .16s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

<div id="app">
  <header class="top">
    <div class="wrap topin">
      <div class="brand"><span class="sl">/</span>Raax<span class="dim"> API inventory</span></div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="top-r">
        <span id="sync" class="sync" role="status"></span>
        <span id="userBadge" class="userpill"></span>
        <button class="btn sm danger" type="button" data-act="clearAllData" id="clearAllBtn" data-edit title="Delete all endpoints and reset inventory">Delete All Data</button>
        <button class="btn primary" type="button" data-act="new" data-edit>New endpoint</button>
        <button class="btn sm ghost" type="button" data-act="logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>
  <main class="wrap main" id="main"></main>
</div>
<div id="backdrop" data-act="close"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Endpoint details">
  <div class="dpad" id="dHead"></div>
  <div class="dpad" id="dTabs"></div>
  <div class="dpad dscroll" id="dBody"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="svcList"></datalist>
<datalist id="testerList"></datalist>
<datalist id="reqIdList"></datalist>
<datalist id="apiNameList"></datalist>
<div id="loginGate" role="dialog" aria-modal="true" aria-labelledby="loginTitle"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

<script>
/* ============================== CORE (pure logic) ============================== */
const Core = (function () {
  'use strict';

  const METHODS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS', 'TRACE'];
  const WRITE = new Set(['POST', 'PUT', 'PATCH', 'DELETE']);
  const STATUS = [['draft', 'Draft'], ['active', 'Active'], ['deprecated', 'Deprecated'], ['retired', 'Retired']];

      localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(S.users));
    } catch (_) {}
  }

  function loadUsersFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_USERS);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (_) {}
    return null;
  }

  function clearAllLocalStorageData() {
    try {
      localStorage.removeItem(STORAGE_KEY_ENDPOINTS);
      S.eps = [];
      S.selected.clear();
      closeDrawer(true);
      renderAll();
      toast('All application endpoints deleted from localStorage.');
    } catch (e) {
      toast('Error clearing data: ' + e.message);
    }
  }

    const el = $('#sync');
    if (!el) return;
    el.className = 'sync' + (warn ? ' warn' : '');
    el.innerHTML = '<i></i><span>' + esc(msg) + '</span>';

  const reqIds = () => Array.from(new Set(S.eps.map((e) => (e.reqId || '').trim()).filter(Boolean))).sort();

  let toastT = 0;
  function toast(msg) {
    const t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3500);
  }

  function touch(e) {
    e.updated = new Date().toISOString();
    saveToLocalStorage();
  }

  function addEndpoint(patch) {
    const e = C.norm(Object.assign(C.blank(S.fSvc || (S.eps[0] && S.eps[0].service) || ''), patch || {}));
    S.eps.unshift(e);

  function hasActiveFilters() {
    return Boolean(S.q || S.fTester || S.fReqId || S.fMethod || S.fApiType || S.fSvc || S.fStatus);
  }

  function invFiltered() {
    const q = S.q.trim().toLowerCase();
    return S.eps.filter((e) => {
      const eType = e.apiType || (e.exposure === 'internal' ? 'internal' : 'external');
      if (S.fTester && (e.tester || '').toLowerCase() !== S.fTester.toLowerCase()) return false;
      if (S.fReqId && (e.reqId || '').toLowerCase() !== S.fReqId.toLowerCase()) return false;
      if (S.fMethod && e.method !== S.fMethod) return false;
      if (S.fApiType && eType !== S.fApiType) return false;
      if (S.fSvc && e.service !== S.fSvc) return false;
      if (S.fStatus && e.status !== S.fStatus) return false;
      if (q) {
        const hay = [e.reqId, e.method, e.path, e.domain, e.baseUrl, e.name, e.service, e.tester, e.tags.join(' ')].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => a.path.localeCompare(b.path));
  }

    const filt = (id, key, label, list) => '<select id="' + id + '" data-flt="' + key + '" aria-label="' + label + '"><option value="">' + label + '</option>' + opts(list, S[key]) + '</select>';
    return '<div class="tool" id="invTool">' +
      '<input class="search" id="q" type="search" placeholder="Search method, path, domain, req-id, tester, service..." value="' + esc(S.q) + '" aria-label="Search endpoints">' +
      filt('fTester', 'fTester', 'All Testers', testers().map((t) => [t, 'Tester: ' + t])) +
      filt('fReqId', 'fReqId', 'All Req-IDs', reqIds().map((r) => [r, 'Req-ID: ' + r])) +
      filt('fMethod', 'fMethod', 'All Methods', C.METHODS.map((m) => [m, m])) +
      filt('fApiType', 'fApiType', 'All API Types', [['internal', 'Internal API'], ['external', 'External API']]) +
      filt('fSvc', 'fSvc', 'All Services', services().map((s) => [s, s])) +
      '<button class="btn sm ghost" id="clrBtn" type="button" data-act="clearFilters"' + (hasActiveFilters() ? '' : ' hidden') + '>Reset Filters</button>' +

    m.innerHTML = v();

    renderChrome();
    renderMain();
    renderDrawer();
  }

  function replan() {
    const i = S.imp;
    if (i.kind === 'postman' && i.spec) {
      const r = C.importPostman(i.spec, { reqId: i.reqId, tester: i.tester });
      i.meta = r;
      i.plan = C.planImport(S.eps, r.endpoints, r.service);
    } else if (i.kind === 'csv' && i.text) {
      const r = C.importCsv(i.text, { reqId: i.reqId, tester: i.tester });
      i.meta = r;
      i.plan = C.planImport(S.eps, r.endpoints, r.service);
    }
  }

  function readImport() {
    const i = S.imp; i.error = ''; i.plan = null;
    try {
      const t = i.text.trim();
      if (C.isCsvDocument(t)) {
        i.kind = 'csv';
        const r = C.importCsv(t, { reqId: i.reqId, tester: i.tester });
        i.meta = r;
        i.plan = C.planImport(S.eps, r.endpoints, r.service);
      } else {
        const spec = C.parseSpec(t, window.jsyaml);
        if (C.isPostmanCollection(spec)) {
          i.kind = 'postman';
          i.spec = spec;
          const r = C.importPostman(spec, { reqId: i.reqId, tester: i.tester });
          i.meta = r;
          i.plan = C.planImport(S.eps, r.endpoints, r.service);
        } else if (Array.isArray(spec)) {
          const endpoints = spec.map(C.norm);
          i.kind = 'json';
          i.meta = { format: 'JSON Array (' + endpoints.length + ' items)' };
          i.plan = C.planImport(S.eps, endpoints, 'JSON API');
        } else {
          throw new Error('Unrecognized JSON/CSV format.');
        }
      }
    } catch (err) {
      i.error = err.message;
    }
    const b = $('#planBox'); if (b) b.innerHTML = planCard();
  }

  async function applyImport() {
    const i = S.imp, p = i.plan;
    if (!p) return;
    const reqIdVal = String(i.reqId || '').trim();
    const testerName = String(i.tester || '').trim();
    if (!reqIdVal || !testerName) {
      toast('Please enter both Req-ID and Tester Name.');
      return;
    }
    const touched = [];
    p.add.forEach((inc) => {
      const e = C.norm(Object.assign({}, inc, { reqId: reqIdVal, tester: testerName }));
      S.eps.unshift(e);
      touched.push(e);
    });
    p.update.forEach((u) => {
      Object.assign(u.ex, u.inc, { reqId: reqIdVal, tester: testerName, updated: new Date().toISOString() });
      touched.push(u.ex);
    });
    saveToLocalStorage();
    toast('Saved ' + (p.add.length + p.update.length) + ' endpoints to localStorage!');
    S.imp = { text: '', spec: null, kind: '', error: '', service: '', owner: '', tester: '', reqId: '', mode: 'merge', backup: null, plan: null, meta: null };
    S.view = 'inventory';
    renderAll();
  }

  /* Event Handlers */
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    switch (act) {
      case 'nav': S.view = t.dataset.v; renderAll(); break;
      case 'open': openDrawer(t.dataset.id); break;
      case 'close': closeDrawer(); break;
      case 'new': {
        const n = addEndpoint({ path: '/new-endpoint', name: 'New Endpoint' });
        S.view = 'inventory'; renderAll(); openDrawer(n.id);
        break;
      }
      case 'clearFilters':
        S.q = S.fSvc = S.fStatus = S.fTester = S.fReqId = S.fMethod = S.fApiType = '';
        renderAll();
        break;
      case 'clearAllData':
        if (S.confirm !== 'clearAll') {
          S.confirm = 'clearAll';
          renderChrome();
          toast('Click "Delete All Data" again within 4s to confirm deleting from localStorage.');
          setTimeout(() => { if (S.confirm === 'clearAll') { S.confirm = ''; renderChrome(); } }, 4000);
          break;
        }
        S.confirm = '';
        clearAllLocalStorageData();
        break;
      case 'loadSample': {
        const samples = C.makeSample();
        S.eps = samples.concat(S.eps);
        saveToLocalStorage();
        toast('Loaded 3 sample endpoints to localStorage.');
        renderAll();
        break;
      }
      case 'loadWeatherSample': {
        const r = C.importPostman(C.WEATHER_COLLECTION, { reqId: 'REQ-WEATHER-01', tester: 'Aarav Verma' });
        S.imp.text = JSON.stringify(C.WEATHER_COLLECTION, null, 2);
        S.imp.spec = C.WEATHER_COLLECTION;
        S.imp.kind = 'postman';
        S.imp.reqId = 'REQ-WEATHER-01';
        S.imp.tester = (S.user && S.user.name) || 'Aarav Verma';
        replan();
        const b = $('#planBox'); if (b) b.innerHTML = planCard();
        toast('Loaded Weather API Postman collection. Click Confirm to import.');
        break;
      }
      case 'readImport': readImport(); break;
      case 'applyImport': applyImport(); break;
      case 'exCopy': {
        const txt = exportText(t.dataset.id);
        S.outText = txt;
        const ta = $('#exportOut'); if (ta) ta.value = txt;
        navigator.clipboard.writeText(txt).then(() => toast('Copied to clipboard!')).catch(() => toast('Copy ready in text box.'));
        break;
      }
      case 'exDownload': {
        const f = FORMATS.find((x) => x.id === t.dataset.id);
        const txt = exportText(t.dataset.id);
        S.outText = txt;
        const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = f.file;
        a.click();
        toast('Downloaded ' + f.file);
        break;
      }
      case 'del': {
        const e = selEp();
        if (e) {
          S.eps = S.eps.filter((x) => x.id !== e.id);
          saveToLocalStorage();
          closeDrawer(true);
          renderAll();
          toast('Endpoint deleted.');
        }
        break;
      }
      case 'logout': {
        S.user = null;
        try { localStorage.removeItem(STORAGE_KEY_AUTH); } catch (_) {}
        renderAll();
        break;
      }
    }
  });

  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'q') { S.q = t.value; renderMain(); const qEl = $('#q'); if (qEl) { qEl.focus(); qEl.setSelectionRange(qEl.value.length, qEl.value.length); } return; }
    if (t.id === 'importText') { S.imp.text = t.value; return; }
    if (t.dataset.imp) { S.imp[t.dataset.imp] = t.value; return; }
    if (t.dataset.f) {
      const e = selEp();
      if (e) {
        e[t.dataset.f] = t.value;
        if (t.dataset.f === 'baseUrl') e.domain = C.extractDomain(t.value, '');
        touch(e);
      }
    }
  });

  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.flt) { S[t.dataset.flt] = t.value; renderMain(); return; }
    if (t.id === 'importFile' && t.files && t.files.length) {
      const reader = new FileReader();
      reader.onload = () => {
        S.imp.text = String(reader.result || '');
        const ta = $('#importText'); if (ta) ta.value = S.imp.text;
        readImport();
        toast('Parsed file: ' + t.files[0].name);
      };
      reader.readAsText(t.files[0]);
      t.value = '';
    }
  });

  document.addEventListener('submit', (ev) => {
    if (ev.target.id === 'setupAdminForm') {
      ev.preventDefault();
      const u = $('#setupUser').value.trim();
      const n = $('#setupName').value.trim();
      const p = $('#setupPass').value.trim();
      S.users = [{ username: u, name: n, role: 'admin', pass: p }];
      saveUsersToStorage();
      S.user = { username: u, name: n, role: 'admin' };
      try { localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify(S.user)); } catch (_) {}
      toast('Admin created and saved to localStorage!');
      renderAll();
    } else if (ev.target.id === 'loginForm') {
      ev.preventDefault();
      const u = $('#loginUser').value.trim();
      const p = $('#loginPass').value.trim();
      const match = S.users.find((x) => x.username === u && x.pass === p);
      if (match) {
        S.user = { username: match.username, name: match.name, role: match.role };
        try { localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify(S.user)); } catch (_) {}
        toast('Welcome back, ' + match.name + '!');
        renderAll();
      } else {
        $('#loginErr').hidden = false;
        $('#loginErr').textContent = 'Invalid username or password.';
      }
    }
  });

  /* Initializer */
  function init() {
    // 1. Load users and auth
    const storedUsers = loadUsersFromStorage();
    if (storedUsers) {
      S.users = storedUsers;
    } else {
      // Default initial admin
      S.users = [{ username: 'admin', name: 'Raax Admin', role: 'admin', pass: 'raax2026' }];
      saveUsersToStorage();
    }

    try {
      const auth = localStorage.getItem(STORAGE_KEY_AUTH);
      if (auth) S.user = JSON.parse(auth);
    } catch (_) {}
    if (!S.user && S.users.length) {
      S.user = { username: S.users[0].username, name: S.users[0].name, role: S.users[0].role };
    }

    // 2. Load API inventory from localStorage
    const storedEps = loadFromLocalStorage();
    if (storedEps !== null) {
      S.eps = storedEps;
      setSyncStatus('Loaded ' + S.eps.length + ' endpoints from localStorage', false);
    } else {
      // First boot: load Weather API Postman collection and samples
      const weatherInit = C.importPostman(C.WEATHER_COLLECTION, { reqId: 'REQ-WEATHER-01', tester: 'Aarav Verma' });
      S.eps = weatherInit.endpoints.concat(C.makeSample());
      saveToLocalStorage();
      setSyncStatus('Initial dataset saved to localStorage', false);
    }

    S.ready = true;
    renderAll();
  }

  init();
})();
</script>
</body></html>
